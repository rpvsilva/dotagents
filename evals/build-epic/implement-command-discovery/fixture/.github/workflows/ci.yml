name: ci
on: [pull_request, push]
# Tests only read the repo.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, since tags can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Keep the token out of .git/config, where the PR's own test code could read it.
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.15" }
      - run: pip install --require-hashes -r requirements-ci.txt
      # Python imports a tracked .pyc/.pyd/.so in place of the reviewed source; .gitignore does not stop `git add -f`.
      - run: "! git ls-files -- '*.pyc' '*.pyd' '*.so' | grep ."
      # -I: a pytest.py in the repo root cannot stand in for pytest.
      # -c: an added pytest.toml, .pytest.toml or .pytest.ini cannot replace the pytest config.
      - run: python -I -m pytest -q -c pyproject.toml
