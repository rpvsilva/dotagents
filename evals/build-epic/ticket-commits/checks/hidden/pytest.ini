[pytest]
# Hidden acceptance tests for epic #402 of the sandbox. Run them with `-c` this file, so the checkout's own pytest
# config and tests are never read; ACCEPT_CHECKOUT names the checkout under test (default: the current folder).
python_files = accept_*.py
python_functions = test_*
testpaths = .
addopts = -p no:cacheprovider
markers =
    strict: pins a form the fixed plan's spec decided in its open-question answers (exact text, placement, an exit code the issue leaves open)
