name: Feature request
description: Suggest a skill, hook or other change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, or what is awkward.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen.
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Group
      description: The group of `groups.json` this belongs to.
      options:
        - core
        - remote
        - pr-loop
        - epics
        - security
        - safety-hooks
        - agent-flow
        - small-tools
        - A new group
        - Not sure
    validations:
      required: true
