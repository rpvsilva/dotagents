name: Runner image

# Builds remote/Dockerfile: on PRs that touch it, to check it builds; on main, to push it to GHCR.
# The image snapshots the whole repo, so every push to main publishes a fresh one.
on:
  pull_request:
    paths:
      - remote/**
      - .dockerignore
      - install.sh
      - scripts/**
      - .github/workflows/runner-image.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rpvsilva/dotagents-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # No persisted credentials: the checkout's .git goes into the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: remote/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
