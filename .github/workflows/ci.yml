name: CI

# Runs on PRs into main only: scripts/merge-pr.sh merges a PR's tested head, so main needs no second run.
# PRs into other branches (build-epic's task PRs into a ticket branch) run their checks locally, to save runners.
# macOS and Windows run in portability.yml, only when shell code changes.
# Jobs run on GitHub-hosted runners, or on self-hosted ones while the repo variable CI_RUNNER names their label
# (scripts/gh-runner.sh serves them from local Docker). Steps install what the runner image lacks.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        # The version pinned in scripts/shellcheck-version, which tests/run.sh also runs. The release binary, not the
        # koalaman/shellcheck image: a self-hosted runner in Docker has no Docker daemon. Python unpacks it (no xz there).
        run: |
          pin="$(cat scripts/shellcheck-version)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$pin/shellcheck-v$pin.linux.$(uname -m).tar.xz" |
            python3 -c 'import sys, tarfile; tarfile.open(fileobj=sys.stdin.buffer, mode="r|xz").extractall(filter="data")'
          git ls-files -z '*.sh' | xargs -0 "./shellcheck-v$pin/shellcheck"
      # The release binary, not the docker:// action: a self-hosted runner in Docker has no Docker daemon.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tests/*.test.sh
        shell: bash
        run: for t in tests/*.test.sh; do echo "== $t"; "$t"; done

  secrets:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
