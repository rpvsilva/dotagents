name: CI

# Runs on PRs into main only: scripts/merge-pr.sh merges a PR's tested head, so main needs no second run.
# PRs into other branches (build-epic's task PRs into a ticket branch) run their checks locally, to save runners.
# macOS and Windows run in portability.yml, only when shell code changes.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        # The image pinned by digest in scripts/shellcheck-image, which tests/run.sh also runs. Read-only mount:
        # the image cannot write to the checkout.
        run: |
          image="$(cat scripts/shellcheck-image)"
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$image"
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tests/*.test.sh
        shell: bash
        run: for t in tests/*.test.sh; do echo "== $t"; "$t"; done

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
