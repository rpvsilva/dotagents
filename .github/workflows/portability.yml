# The tests on Windows (Git Bash), run by hand: gh workflow run portability.yml --ref <branch>.
# Paused on PRs while hosted minutes are out: a Windows runner cannot be self-hosted in Docker (ci.yml, scripts/gh-runner.sh).
# To run it on PRs again, put back under on:
#   pull_request: { branches: [main], paths: [install.sh, scripts/**, tests/**, adapters/**, .github/workflows/portability.yml] }
# macOS is covered by tests/run.sh, which every change passes locally before pushing (AGENTS.md); hosted macOS runners
# queued for a long time here.
name: portability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tests/*.test.sh
        shell: bash
        run: for t in tests/*.test.sh; do echo "== $t"; "$t"; done
