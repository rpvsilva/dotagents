# Does nothing itself: its completion re-runs agent-pr-gate (via workflow_run) after a review.
name: review-relay

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review recorded; agent-pr-gate re-runs via workflow_run."
